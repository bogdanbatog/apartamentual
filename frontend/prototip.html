<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Povestea Noastră — Prototipul Județului Housing | ApartamenTUal</title>
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-DV5BzzPUWOAnlwlSZU8LW.js"></script>
<script>

</script>
    <meta name="description" content="Povestea ApartamenTUal: de la o idee la primul prototip de grup de construcție în România. Urmărește evoluția proiectului.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/nav.css">
    <style>
        /* Hero */
        .story-hero {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white; padding: 5rem 1rem 4rem; text-align: center;
        }
        .story-hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .story-hero .subtitle { color: #f59e0b; font-size: 1.15rem; font-weight: 600; }
        .story-hero .desc { color: #94a3b8; font-size: 1rem; max-width: 600px; margin: 1rem auto 0; }
        
        /* Story (main article) */
        .story-content { max-width: 800px; margin: -2rem auto 0; padding: 0 1rem; position: relative; z-index: 1; }
        .story-block {
            background: white; border-radius: 0.75rem; border: 1px solid #e2e8f0;
            padding: 2.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .story-block img { width: 100%; border-radius: 0.5rem; margin: 1.5rem 0 0.5rem; }
        .story-block video, .story-block iframe { width: 100%; border-radius: 0.5rem; margin: 1.5rem 0 0.5rem; }
        
        /* Article HTML content styling */
        .story-html h2 { font-size: 1.4rem; font-weight: 700; color: #1e293b; margin: 1.5rem 0 0.75rem; }
        .story-html h3 { font-size: 1.1rem; font-weight: 600; color: #1e293b; margin: 1.25rem 0 0.5rem; }
        .story-html p { font-size: 0.95rem; color: #475569; line-height: 1.8; margin-bottom: 1rem; }
        .story-html ul, .story-html ol { margin: 0.5rem 0 1rem 1.5rem; color: #475569; font-size: 0.92rem; line-height: 1.7; }
        .story-html li { margin-bottom: 0.3rem; }
        .story-html strong { color: #1e293b; }
        .story-html a { color: #f59e0b; text-decoration: underline; }
        .story-html blockquote { border-left: 3px solid #f59e0b; padding: 0.75rem 1.25rem; background: #fffbeb; margin: 1rem 0; border-radius: 0 0.4rem 0.4rem 0; font-style: italic; color: #92400e; }
        .story-html img { width: 100%; border-radius: 0.5rem; margin: 1rem 0; }
        
        /* Extra images gallery */
        .extra-gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.75rem; margin-top: 1.5rem;
        }
        .extra-gallery img { width: 100%; border-radius: 0.5rem; object-fit: cover; aspect-ratio: 4/3; cursor: pointer; transition: transform 0.2s; }
        .extra-gallery img:hover { transform: scale(1.02); }
        
        /* Loading / empty */
        .story-loading { text-align: center; padding: 4rem 1rem; color: #94a3b8; }
        
        /* Updates section */
        .updates-section { max-width: 800px; margin: 1rem auto 3rem; padding: 0 1rem; }
        .updates-divider { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .updates-divider h2 { font-size: 1.5rem; font-weight: 700; color: #1e293b; white-space: nowrap; }
        .updates-divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        
        .update-card {
            background: white; border-radius: 0.75rem; border: 1px solid #e2e8f0;
            overflow: hidden; margin-bottom: 1.25rem; transition: box-shadow 0.2s;
        }
        .update-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .update-card-img { width: 100%; max-height: 400px; object-fit: cover; }
        .update-card-inner { padding: 1.5rem 2rem; }
        .update-date { font-size: 0.78rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .update-title { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; }
        .update-body { font-size: 0.9rem; color: #475569; line-height: 1.7; }
        .update-body img { max-width: 100%; border-radius: 0.5rem; margin: 0.75rem 0; }
        
        .share-btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.35rem 0.75rem; border-radius: 0.4rem;
            font-size: 0.75rem; color: #64748b; border: 1px solid #e2e8f0;
            background: white; cursor: pointer; transition: all 0.15s; text-decoration: none;
        }
        .share-btn:hover { border-color: #f59e0b; color: #f59e0b; }
        
        @media (max-width: 640px) {
            .story-hero { padding: 3rem 1rem 2.5rem; }
            .story-hero h1 { font-size: 1.8rem; }
            .story-block { padding: 1.5rem; }
            .extra-gallery { grid-template-columns: 1fr 1fr; }
        }
    </style>
    <!-- Favicon (toate dimensiunile pentru cross-browser/device) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0f172a">
</head>
<body class="min-h-screen flex flex-col bg-gray-50 text-gray-900">
    <div id="navigation"></div>

    <!-- Hero -->
    <div class="story-hero">
        <nav style="max-width: 800px; margin: 0 auto 1.5rem; font-size: 0.82rem; color: #94a3b8;">
            <a href="index.html" style="color: #f59e0b; text-decoration: none;">Acasă</a>
            <span style="margin: 0 0.4rem; opacity: 0.5;">›</span>
            Povestea noastră
        </nav>
        <h1>Povestea noastră</h1>
        <p class="subtitle">Prototipul Județului Housing</p>
        <p class="desc">De la o întrebare simplă la primul grup de construcție din România</p>
    </div>

    <!-- Story content — loaded from article with slug 'povestea-noastra' -->
    <div class="story-content">
        <div id="story-main" class="story-block" style="display: none;"></div>
        <div id="story-loading" class="story-loading">
            <p>Se încarcă povestea...</p>
        </div>
    </div>

    <!-- Dynamic Updates from Supabase (all prototip articles except the main story) -->
    <div class="updates-section" id="noutati">
        <div class="updates-divider">
            <h2><i class="fas fa-bullhorn" style="color: #f59e0b; margin-right: 0.4rem;"></i> Noutăți</h2>
        </div>
        <div id="updates-list"></div>
        <div id="updates-empty" class="hidden" style="text-align: center; padding: 3rem 1rem;">
            <i class="fas fa-newspaper" style="font-size: 2rem; color: #cbd5e1; display: block; margin-bottom: 1rem;"></i>
            <p style="color: #94a3b8; font-size: 0.9rem;">Noutăți în curând. Rămâi pe aproape!</p>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/supabase-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/login-modal.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        loadStory();
        loadUpdates();
    });

    // ── MAIN STORY ──
    async function loadStory() {
        const container = document.getElementById('story-main');
        const loading = document.getElementById('story-loading');
        
        try {
            const { data, error } = await supabase
                .from('articles')
                .select('*')
                .eq('slug', 'povestea-noastra')
                .eq('status', 'published')
                .single();
            
            if (error || !data) {
                // No story article yet — show placeholder
                loading.innerHTML = `
                    <div style="padding: 2rem; text-align: center;">
                        <p style="color: #94a3b8; font-size: 0.9rem;">
                            Povestea va fi publicată în curând.<br>
                            <span style="font-size: 0.8rem;">
                                (Creează un articol cu slug-ul <code style="background: #f1f5f9; padding: 0.15rem 0.4rem; border-radius: 0.25rem;">povestea-noastra</code> 
                                și categoria <code style="background: #f1f5f9; padding: 0.15rem 0.4rem; border-radius: 0.25rem;">prototip</code> în admin.)
                            </span>
                        </p>
                    </div>`;
                return;
            }
            
            loading.style.display = 'none';
            
            // Build story HTML
            let html = '';
            
            // Main image
            if (data.image_url) {
                html += `<img src="${data.image_url}" alt="${data.title}" style="width: 100%; border-radius: 0.5rem; margin-bottom: 1.5rem;">`;
            }
            
            // Summary as intro
            if (data.summary) {
                html += `<p style="font-size: 1.1rem; color: #334155; line-height: 1.8; margin-bottom: 1.5rem; font-weight: 500;">${data.summary}</p>`;
            }
            
            // Main content (HTML from editor)
            if (data.content) {
                html += `<div class="story-html">${data.content}</div>`;
            }
            
            // Extra images gallery
            if (data.extra_images && data.extra_images.length > 0) {
                html += `<div class="extra-gallery">`;
                data.extra_images.forEach(img => {
                    html += `<img src="${img}" alt="" onclick="window.open('${img}', '_blank')">`;
                });
                html += `</div>`;
            }
            
            // Source
            if (data.source_url) {
                try {
                    const domain = new URL(data.source_url).hostname.replace('www.', '');
                    html += `<p style="font-size: 0.82rem; color: #94a3b8; margin-top: 1.5rem;">Preluat de pe: <a href="${data.source_url}" target="_blank" style="color: #f59e0b;">${domain}</a></p>`;
                } catch(e) {}
            }
            
            container.innerHTML = html;
            container.style.display = 'block';
            
        } catch (err) {
            console.error('Error loading story:', err);
            loading.innerHTML = '<p style="color: #ef4444;">Eroare la încărcarea poveștii.</p>';
        }
    }

    // ── UPDATES (all prototip articles except povestea-noastra) ──
    async function loadUpdates() {
        const list = document.getElementById('updates-list');
        const empty = document.getElementById('updates-empty');
        
        try {
            const { data: updates, error } = await supabase
                .from('articles')
                .select('*')
                .eq('category', 'prototip')
                .eq('status', 'published')
                .neq('slug', 'povestea-noastra')
                .order('published_at', { ascending: false });
            
            if (error) throw error;
            
            if (!updates || updates.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            
            list.innerHTML = updates.map(u => {
                const date = new Date(u.published_at).toLocaleDateString('ro-RO', { 
                    day: 'numeric', month: 'long', year: 'numeric' 
                });
                
                const imgHtml = u.image_url ? `<img class="update-card-img" src="${u.image_url}" alt="${u.title}">` : '';
                
                let extraHtml = '';
                if (u.extra_images && u.extra_images.length > 0) {
                    extraHtml = `<div class="extra-gallery" style="margin-top: 0.75rem;">
                        ${u.extra_images.map(img => `<img src="${img}" alt="" onclick="window.open('${img}', '_blank')">`).join('')}
                    </div>`;
                }

                let sourceHtml = '';
                if (u.source_url) {
                    try {
                        const domain = new URL(u.source_url).hostname.replace('www.', '');
                        sourceHtml = `<p style="font-size: 0.78rem; color: #94a3b8; margin-top: 0.5rem;">Preluat de pe: <a href="${u.source_url}" target="_blank" style="color: #f59e0b;">${domain}</a></p>`;
                    } catch(e) {}
                }

                const shareUrl = `${window.location.origin}/prototip.html#${u.slug}`;
                
                return `
                    <div class="update-card" id="update-${u.slug}">
                        ${imgHtml}
                        <div class="update-card-inner">
                            <div class="update-date">${date}</div>
                            <div class="update-title">${u.title}</div>
                            ${u.summary ? `<div class="update-body">${u.summary}</div>` : ''}
                            ${u.content ? `<div class="update-body">${u.content}</div>` : ''}
                            ${extraHtml}
                            ${sourceHtml}
                            <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid #f1f5f9;">
                                <button class="share-btn" onclick="copyLink('${shareUrl}', this)">
                                    <i class="fas fa-link"></i> Copiază link
                                </button>
                                <a class="share-btn" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}" target="_blank">
                                    <i class="fab fa-facebook-f"></i> Share
                                </a>
                                <a class="share-btn" href="https://wa.me/?text=${encodeURIComponent(u.title + ' ' + shareUrl)}" target="_blank">
                                    <i class="fab fa-whatsapp"></i>
                                </a>
                            </div>
                        </div>
                    </div>`;
            }).join('');
            
            // Scroll to specific update if hash
            if (window.location.hash) {
                const id = window.location.hash.slice(1);
                const target = document.getElementById('update-' + id);
                if (target) {
                    setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
                }
            }
            
        } catch (err) {
            console.error('Error loading updates:', err);
            empty.classList.remove('hidden');
        }
    }

    function copyLink(url, btn) {
        navigator.clipboard.writeText(url).then(() => {
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Copiat!';
            btn.style.color = '#16a34a';
            btn.style.borderColor = '#16a34a';
            setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
        });
    }
    </script>
</body>
</html>
