<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articole - ApartamenTUal</title>
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-DV5BzzPUWOAnlwlSZU8LW.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
    <meta name="description" content="Articole, sfaturi și noutăți despre construcția în grup.">
    <!-- Open Graph / Twitter (previzualizare link la distribuire) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ApartamenTUal">
    <meta property="og:locale" content="ro_RO">
    <meta property="og:title" content="Povești și resurse despre construcția în grup">
    <meta property="og:description" content="Articole, exemple și povestea reală a primului mic bloc colaborativ din România.">
    <meta property="og:image" content="https://apartamentual.ro/assets/images/judetul-housing/randari/15-randare-fatada-curte.jpg">
    <meta property="og:url" content="https://apartamentual.ro/news.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Povești și resurse despre construcția în grup">
    <meta name="twitter:description" content="Articole, exemple și povestea reală a primului mic bloc colaborativ din România.">
    <meta name="twitter:image" content="https://apartamentual.ro/assets/images/judetul-housing/randari/15-randare-fatada-curte.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/apartamentual-v9.css">
    <style>
        /* Reskin v9: hero pe ink, carduri crem-soft, accente ink (fără slate/portocaliu) */
        #navigation { margin-bottom: 0; } /* hero full-bleed */
        .news-hero {
            background: #1a1a1a;
            color: #fff;
            padding: 3rem 1rem 3.5rem;
            text-align: center;
        }
        .news-hero h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .news-hero p {
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
        }

        .news-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Category filter */
        .news-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            justify-content: center;
        }
        .filter-btn {
            padding: 0.4rem 1rem;
            border: 1px solid var(--rule-2);
            background: #fff;
            border-radius: 2rem;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--ink-2);
            transition: all 0.15s;
        }
        .filter-btn:hover { border-color: var(--ink); color: var(--ink); }
        .filter-btn.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }
        
        /* Article cards */
        .articles-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .article-card {
            background: #fff;
            border-radius: 0.75rem;
            border: 1px solid var(--rule);
            overflow: hidden;
            display: flex;
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .article-card-image {
            width: 240px;
            min-height: 180px;
            flex-shrink: 0;
            background: var(--bg-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-3);
            font-size: 2rem;
        }
        .article-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .article-card-body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .article-card-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.78rem;
            color: var(--ink-3);
            margin-bottom: 0.5rem;
        }
        .article-category-badge {
            padding: 0.15rem 0.5rem;
            background: #f5efe1;
            color: var(--ink);
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .article-card-body h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        .article-card-body p {
            color: var(--ink-2);
            font-size: 0.9rem;
            line-height: 1.5;
            flex: 1;
        }
        .article-read-more {
            color: var(--ink);
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 0.75rem;
        }
        
        /* Single article view */
        .article-full {
            display: none;
            max-width: 750px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .article-full-back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--ink-2);
            text-decoration: none;
            font-size: 0.88rem;
            margin-bottom: 1.5rem;
        }
        .article-full-back:hover { color: var(--ink); }
        .article-full h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }
        .article-full-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--ink-3);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--rule);
        }
        .article-full-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 0.75rem;
            margin-bottom: 2rem;
        }
        .article-full-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--ink-2);
        }
        .article-full-content h2 { font-size: 1.4rem; margin: 1.5rem 0 0.75rem; color: var(--ink); }
        .article-full-content h3 { font-size: 1.15rem; margin: 1.25rem 0 0.5rem; color: var(--ink); }
        .article-full-content p { margin-bottom: 1rem; }
        .article-full-content ul, .article-full-content ol { margin-bottom: 1rem; padding-left: 1.5rem; }
        .article-full-content li { margin-bottom: 0.4rem; }
        .article-full-content blockquote {
            border-left: 3px solid var(--ink);
            padding: 0.75rem 1.25rem;
            background: var(--bg-soft);
            margin: 1rem 0;
            font-style: italic;
            color: var(--ink-2);
        }
        
        /* Loading & empty */
        .news-loading, .news-empty {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--ink-3);
        }
        .news-empty i { font-size: 2.5rem; margin-bottom: 1rem; display: block; }
        
        @media (max-width: 640px) {
            .article-card { flex-direction: column; }
            .article-card-image { width: 100%; min-height: 160px; }
            .article-full h1 { font-size: 1.5rem; }
        }
    </style>
    <!-- Favicon (toate dimensiunile pentru cross-browser/device) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
    <!-- Nav placeholder -->
    <div id="navigation"></div>

    <div class="news-hero">
        <h1>Articole și Noutăți</h1>
        <p>Sfaturi, analize și informații utile despre construcția în grup</p>
    </div>
    
    <!-- Articles list view -->
    <div id="listView">
        <div class="news-container">
            <div class="news-filters" id="categoryFilters">
                <button class="filter-btn active" data-cat="all">Toate</button>
                <button class="filter-btn" data-cat="exemple">Exemple</button>
                <button class="filter-btn" data-cat="legal">Legal</button>
                <button class="filter-btn" data-cat="analize">Analize</button>
                <button class="filter-btn" data-cat="noutati">Noutăți</button>
                <button class="filter-btn" data-cat="prototip">Prototip</button>
            </div>
            
            <div class="news-loading" id="newsLoading">
                <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem;"></i>
                <p>Se încarcă articolele...</p>
            </div>
            
            <div class="articles-grid" id="articlesGrid" style="display: none;"></div>
            
            <div class="news-empty" id="newsEmpty" style="display: none;">
                <i class="fas fa-newspaper"></i>
                <p>Nu sunt articole încă. Reveniti curând!</p>
            </div>
        </div>
    </div>
    
    <!-- Single article view -->
    <div class="article-full" id="articleView">
        <a href="#" class="article-full-back" onclick="showList(); return false;">
            <i class="fas fa-arrow-left"></i> Înapoi la articole
        </a>
        <h1 id="articleViewTitle"></h1>
        <div class="article-full-meta">
            <span id="articleViewCategory" class="article-category-badge"></span>
            <span id="articleViewDate"></span>
        </div>
        <div id="articleViewSource" style="display: none; margin-bottom: 1.25rem; padding: 0.6rem 1rem; background: #e9eef3; border-left: 3px solid #5a7196; border-radius: 0 0.35rem 0.35rem 0; font-size: 0.85rem; color: #1a1a1a;">
            <i class="fas fa-external-link-alt" style="color: #5a7196; margin-right: 0.3rem;"></i>
            Preluat de pe: <a id="articleViewSourceLink" href="#" target="_blank" style="color: #1a1a1a; font-weight: 500;"></a>
        </div>
        <img id="articleViewImage" class="article-full-image" style="display: none;">
        <div class="article-full-content" id="articleViewContent"></div>
        <div id="articleViewExtraImages" style="display: none; margin-top: 2rem;"></div>

        <!-- Distribuire articol -->
        <style>
            .article-share{ margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; }
            .article-share__label{ display: block; font-size: 0.9rem; color: #555; margin-bottom: 0.75rem; font-weight: 600; }
            .article-share__btns{ display: flex; flex-wrap: wrap; gap: 0.6rem; }
            .article-share__btn{ display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.55rem 1rem; font-size: 0.9rem; font-family: inherit; color: #1a1a1a; background: #fff; border: 1px solid rgba(0,0,0,0.18); border-radius: 0.6rem; cursor: pointer; text-decoration: none; transition: background .2s ease, color .2s ease; }
            .article-share__btn:hover{ background: #1a1a1a; color: #fff; }
        </style>
        <div class="article-share">
            <span class="article-share__label">Distribuie articolul</span>
            <div class="article-share__btns">
                <button type="button" id="shareCopy" class="article-share__btn"><i class="fas fa-link"></i> Copiază link</button>
                <a id="shareWhatsApp" class="article-share__btn" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a id="shareFacebook" class="article-share__btn" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i> Facebook</a>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="js/supabase-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/login-modal.js"></script>
    <script>
    let articles = [];
    let currentFilter = 'all';
    
    const categoryLabels = {
        exemple: 'Exemple',
        legal: 'Legal',
        analize: 'Analize',
        noutati: 'Noutăți',
        prototip: 'Prototip'
    };
    
    document.addEventListener('DOMContentLoaded', async () => {
        await loadArticles();
        
        // Check if URL hash points to an article
        if (window.location.hash) {
            const slug = window.location.hash.slice(1);
            const article = articles.find(a => a.slug === slug);
            if (article) showArticle(article);
        }
    });
    
    // Category filters
    document.getElementById('categoryFilters').addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.cat;
        renderArticles();
    });
    
    async function loadArticles() {
        try {
            const { data, error } = await sb
                .from('articles')
                .select('*')
                .eq('status', 'published')
                .order('published_at', { ascending: false });
            
            if (error) throw error;
            articles = data || [];
            renderArticles();
        } catch (e) {
            console.error('Load articles error:', e);
            document.getElementById('newsLoading').style.display = 'none';
            document.getElementById('newsEmpty').style.display = 'block';
        }
    }
    
    function renderArticles() {
        const grid = document.getElementById('articlesGrid');
        const loading = document.getElementById('newsLoading');
        const empty = document.getElementById('newsEmpty');
        
        loading.style.display = 'none';
        
        const filtered = currentFilter === 'all' 
            ? articles 
            : articles.filter(a => a.category === currentFilter);
        
        if (filtered.length === 0) {
            grid.style.display = 'none';
            empty.style.display = 'block';
            return;
        }
        
        empty.style.display = 'none';
        grid.style.display = 'flex';
        
        grid.innerHTML = filtered.map(a => {
            const date = a.published_at ? new Date(a.published_at).toLocaleDateString('ro-RO', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
            const summary = a.summary || (a.content ? a.content.replace(/<[^>]*>/g, '').slice(0, 150) + '...' : '');
            
            return `
                <a class="article-card" onclick="showArticle(articles.find(x => x.id === '${a.id}'))">
                    <div class="article-card-image">
                        ${a.image_url 
                            ? `<img src="${a.image_url}" alt="${escapeHtml(a.title)}">`
                            : '<i class="fas fa-newspaper"></i>'}
                    </div>
                    <div class="article-card-body">
                        <div class="article-card-meta">
                            <span class="article-category-badge">${categoryLabels[a.category] || a.category}</span>
                            <span>${date}</span>
                        </div>
                        <h2>${escapeHtml(a.title)}</h2>
                        <p>${escapeHtml(summary)}</p>
                        <span class="article-read-more">Citește mai mult →</span>
                    </div>
                </a>
            `;
        }).join('');
    }
    
    function showArticle(article) {
        if (!article) return;
        
        document.getElementById('listView').style.display = 'none';
        document.getElementById('articleView').style.display = 'block';
        document.querySelector('.news-hero').style.display = 'none';
        
        document.getElementById('articleViewTitle').textContent = article.title;
        document.getElementById('articleViewCategory').textContent = categoryLabels[article.category] || article.category;
        document.getElementById('articleViewDate').textContent = article.published_at 
            ? new Date(article.published_at).toLocaleDateString('ro-RO', { day: 'numeric', month: 'long', year: 'numeric' })
            : '';
        
        // Source URL
        const sourceDiv = document.getElementById('articleViewSource');
        if (article.source_url) {
            const sourceLink = document.getElementById('articleViewSourceLink');
            sourceLink.href = article.source_url;
            // Show domain name as link text
            try {
                sourceLink.textContent = new URL(article.source_url).hostname.replace('www.', '');
            } catch (e) {
                sourceLink.textContent = article.source_url;
            }
            sourceDiv.style.display = 'block';
        } else {
            sourceDiv.style.display = 'none';
        }
        
        // Main image
        const img = document.getElementById('articleViewImage');
        if (article.image_url) {
            img.src = article.image_url;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }
        
        // Content
        document.getElementById('articleViewContent').innerHTML = article.content;
        
        // Extra images
        const extraContainer = document.getElementById('articleViewExtraImages');
        if (article.extra_images && article.extra_images.length > 0) {
            extraContainer.innerHTML = article.extra_images.map(url => 
                `<img src="${url}" style="width: 100%; border-radius: 0.75rem; margin-bottom: 1rem; border: 1px solid #e2e8f0;" onerror="this.style.display='none'">`
            ).join('');
            extraContainer.style.display = 'block';
        } else {
            extraContainer.style.display = 'none';
        }
        
        // Update URL hash
        window.location.hash = article.slug;
        document.title = article.title + ' - ApartamenTUal';

        // Butoane de distribuire (URL canonic al articolului)
        const shareUrl = 'https://apartamentual.ro/news.html#' + article.slug;
        const shareText = article.title + ' · ApartamenTUal';
        const waBtn = document.getElementById('shareWhatsApp');
        const fbBtn = document.getElementById('shareFacebook');
        if (waBtn) waBtn.href = 'https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + shareUrl);
        if (fbBtn) fbBtn.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl);
        const copyBtn = document.getElementById('shareCopy');
        if (copyBtn) {
            copyBtn.onclick = function() {
                navigator.clipboard.writeText(shareUrl).then(function() {
                    const orig = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Link copiat';
                    setTimeout(function() { copyBtn.innerHTML = orig; }, 2000);
                });
            };
        }

        // Scroll to top
        window.scrollTo(0, 0);
    }
    
    function showList() {
        document.getElementById('listView').style.display = 'block';
        document.getElementById('articleView').style.display = 'none';
        document.querySelector('.news-hero').style.display = 'block';
        window.location.hash = '';
        document.title = 'Articole - ApartamenTUal';
    }
    
    // Handle back button
    window.addEventListener('hashchange', () => {
        if (!window.location.hash) {
            showList();
        } else {
            const slug = window.location.hash.slice(1);
            const article = articles.find(a => a.slug === slug);
            if (article) showArticle(article);
        }
    });
    
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    </script>
</body>
</html>
