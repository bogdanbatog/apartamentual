<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înscrie Grup - ApartamenTUal</title>
    <meta name="description" content="Înscrie grupul tău pe platformă sau editează un grup existent.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    maxWidth: {
                        '6xl': '72rem',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-900">
    <div id="navigation"></div>

    <main class="flex-1">
        <div class="container py-8">
            <!-- Loading State -->
            <div id="loading" class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <p class="mt-2 text-gray-600">Se încarcă...</p>
            </div>

            <!-- Error State -->
            <div id="error" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6" style="display: none;">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-red-800">Eroare</h3>
                        <div class="mt-2 text-sm text-red-700">
                            <p id="error-message"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Success State -->
            <div id="success" class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6" style="display: none;">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <h3 class="text-sm font-medium text-green-800">Succes!</h3>
                        <div class="mt-2 text-sm text-green-700">
                            <p id="success-message"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Content -->
            <div id="form-content" style="display: none;">
                <!-- Header -->
                <div class="mb-8">
                    <h1 id="form-title" class="text-3xl font-bold mb-2">Înscrie grup nou</h1>
                    <p class="text-gray-600">Completează informațiile despre grupul tău pentru a-l face vizibil pe platformă</p>
                </div>

                <!-- Form -->
                <form id="group-form" class="space-y-8">
                    <!-- Basic Information -->
                    <div class="card">
                        <h2 class="text-xl font-semibold mb-6">Informații de bază</h2>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="md:col-span-2">
                                <label for="nume" class="block text-sm font-medium text-gray-700 mb-2">
                                    Numele grupului <span class="text-red-500">*</span>
                                </label>
                                <input type="text" id="nume" name="nume" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="ex: Grupul Verde București">
                            </div>

                            <div class="md:col-span-2">
                                <label for="descriere" class="block text-sm font-medium text-gray-700 mb-2">
                                    Descrierea grupului <span class="text-red-500">*</span>
                                </label>
                                <textarea id="descriere" name="descriere" rows="4" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="Descrie obiectivele și caracteristicile grupului tău..."></textarea>
                            </div>

                            <div>
                                <label for="zona" class="block text-sm font-medium text-gray-700 mb-2">
                                    Zona/Locația <span class="text-red-500">*</span>
                                </label>
                                <select id="zona" name="zona" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="">Selectează zona</option>
                                    <option value="București">București</option>
                                    <option value="Cluj-Napoca">Cluj-Napoca</option>
                                    <option value="Timișoara">Timișoara</option>
                                    <option value="Iași">Iași</option>
                                    <option value="Constanța">Constanța</option>
                                    <option value="Craiova">Craiova</option>
                                    <option value="Galați">Galați</option>
                                    <option value="Ploiești">Ploiești</option>
                                    <option value="Brașov">Brașov</option>
                                    <option value="Brăila">Brăila</option>
                                    <option value="Altele">Altele</option>
                                </select>
                            </div>

                            <div>
                                <label for="max_members" class="block text-sm font-medium text-gray-700 mb-2">
                                    Numărul maxim de membri <span class="text-red-500">*</span>
                                </label>
                                <input type="number" id="max_members" name="max_members" min="2" max="50" required
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="ex: 10">
                            </div>
                        </div>
                    </div>

                    <!-- Project Details -->
                    <div class="card">
                        <h2 class="text-xl font-semibold mb-6">Detalii proiect</h2>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="nr_apartamente_dorite" class="block text-sm font-medium text-gray-700 mb-2">
                                    Numărul de apartamente dorite
                                </label>
                                <input type="number" id="nr_apartamente_dorite" name="nr_apartamente_dorite" min="1"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="ex: 8">
                            </div>

                            <div>
                                <label for="buget_max_per_apartament" class="block text-sm font-medium text-gray-700 mb-2">
                                    Buget maxim per apartament (€)
                                </label>
                                <input type="number" id="buget_max_per_apartament" name="buget_max_per_apartament" min="0"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="ex: 120000">
                            </div>

                            <div>
                                <label for="data_incepere_proiect" class="block text-sm font-medium text-gray-700 mb-2">
                                    Data începerii proiectului
                                </label>
                                <input type="date" id="data_incepere_proiect" name="data_incepere_proiect"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>

                            <div>
                                <label for="data_finalizare_proiect" class="block text-sm font-medium text-gray-700 mb-2">
                                    Data finalizării proiectului
                                </label>
                                <input type="date" id="data_finalizare_proiect" name="data_finalizare_proiect"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                    </div>

                    <!-- Group Image -->
                    <div class="card">
                        <h2 class="text-xl font-semibold mb-6">Imagine grup (opțional)</h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label for="poza" class="block text-sm font-medium text-gray-700 mb-2">
                                    Încarcă o imagine reprezentativă pentru grup
                                </label>
                                <input type="file" id="poza" name="poza" accept="image/*"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <p class="text-sm text-gray-500 mt-1">Formate acceptate: JPG, PNG. Dimensiune maximă: 5MB</p>
                            </div>
                            
                            <div id="image-preview" class="hidden">
                                <img id="preview-img" src="" alt="Preview" class="w-32 h-32 object-cover rounded-lg border">
                            </div>
                        </div>
                    </div>

                    <!-- Privacy Settings -->
                    <div class="card">
                        <h2 class="text-xl font-semibold mb-6">Setări de confidențialitate</h2>
                        
                        <div class="space-y-4">
                            <div class="flex items-center">
                                <input type="checkbox" id="is_public" name="is_public" checked
                                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                                <label for="is_public" class="ml-2 block text-sm text-gray-700">
                                    Grup public (vizibil pentru toți utilizatorii)
                                </label>
                            </div>
                            
                            <div class="flex items-center">
                                <input type="checkbox" id="is_disabled" name="is_disabled"
                                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                                <label for="is_disabled" class="ml-2 block text-sm text-gray-700">
                                    Grup dezactivat (nu va fi vizibil pe platformă)
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="flex flex-col sm:flex-row gap-4 justify-end">
                        <a href="/grupuri.html" class="px-6 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 text-center">
                            Anulează
                        </a>
                        <button type="submit" id="submit-btn" class="primary">
                            <span id="submit-text">Înscrie grupul</span>
                            <span id="submit-loading" class="hidden">
                                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                Se salvează...
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="js/nav.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/auth-modal.js"></script>
    <script src="js/app.js"></script>
    <script src="js/grup-form.js"></script>
</body>
</html>
