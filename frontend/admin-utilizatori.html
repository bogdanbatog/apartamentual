<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Utilizatori - ApartamenTUal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>body { font-family: 'DM Sans', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="bg-white border-b px-6 py-4 flex items-center justify-between">
        <div>
            <h1 class="text-lg font-bold text-gray-900">Admin — Utilizatori</h1>
            <p class="text-sm text-gray-500">Gestionează conturile de pe platformă</p>
        </div>
        <a href="/admin.html" class="text-sm text-gray-500 hover:text-gray-700">← Admin panel</a>
    </div>

    <div class="px-6 py-4 flex gap-2 flex-wrap items-center">
        <button onclick="filterUsers('all')" class="u-filter active px-3 py-1.5 rounded-full text-xs font-medium border border-gray-300 bg-gray-900 text-white" data-st="all">Toți</button>
        <button onclick="filterUsers('activ')" class="u-filter px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 bg-white text-gray-600 hover:border-gray-400" data-st="activ">👤 Activi</button>
        <button onclick="filterUsers('profesional')" class="u-filter px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 bg-white text-gray-600 hover:border-gray-400" data-st="profesional">🏢 Agenții</button>
        <button onclick="filterUsers('pending')" class="u-filter px-3 py-1.5 rounded-full text-xs font-medium border border-orange-300 bg-orange-50 text-orange-700 hover:bg-orange-100" data-st="pending">⏳ Pending aprobare</button>
        <button onclick="filterUsers('suspended')" class="u-filter px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 bg-white text-gray-600 hover:border-gray-400" data-st="suspended">⚠️ Suspendați</button>
        <button onclick="filterUsers('deleted')" class="u-filter px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 bg-white text-gray-600 hover:border-gray-400" data-st="deleted">🗑️ Șterși</button>
        <div class="ml-auto text-sm text-gray-400" id="userCount"></div>
    </div>

    <div class="px-6">
        <div class="bg-white rounded-xl border overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="text-left px-4 py-3 font-medium text-gray-600">Utilizator</th>
                        <th class="text-left px-4 py-3 font-medium text-gray-600">Email</th>
                        <th class="text-left px-4 py-3 font-medium text-gray-600">Tip cont</th>
                        <th class="text-left px-4 py-3 font-medium text-gray-600">Oraș</th>
                        <th class="text-left px-4 py-3 font-medium text-gray-600">Înregistrat</th>
                        <th class="text-right px-4 py-3 font-medium text-gray-600">Acțiuni</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="6" class="px-4 py-8 text-center text-gray-400">Se încarcă...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/nav.js"></script>
    <script>
    var allUsers = [];
    var currentFilter = 'all';

    async function checkAdmin() {
        var { data: { user } } = await sb.auth.getUser();
        if (!user) { window.location.href = '/index.html'; return; }
        var { data: profile } = await sb.from('profiles').select('is_super_admin').eq('user_id', user.id).single();
        if (!profile || !profile.is_super_admin) { window.location.href = '/index.html'; return; }
        loadUsers();
    }

    async function loadUsers() {
        var { data } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
        allUsers = data || [];
        renderTable();
    }

    function renderTable() {
        var filtered;
        if (currentFilter === 'all') {
            filtered = allUsers;
        } else if (currentFilter === 'suspended') {
            filtered = allUsers.filter(function(u) { return u.suspended_until && new Date(u.suspended_until) > new Date(); });
        } else if (currentFilter === 'deleted') {
            filtered = allUsers.filter(function(u) { return u.account_status === 'deleted'; });
        } else if (currentFilter === 'pending') {
            // Agencies awaiting approval
            filtered = allUsers.filter(function(u) { 
                return u.account_type === 'profesional' 
                    && u.account_status === 'pending'; 
            });
        } else {
            // activ or profesional - exclude deleted AND suspended
            filtered = allUsers.filter(function(u) { 
                return u.account_type === currentFilter 
                    && u.account_status !== 'deleted' 
                    && !(u.suspended_until && new Date(u.suspended_until) > new Date()); 
            });
        }
        document.getElementById('userCount').textContent = filtered.length + ' utilizatori';
        var body = document.getElementById('usersBody');
        if (filtered.length === 0) {
            body.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-400">Niciun utilizator.</td></tr>';
            return;
        }
        body.innerHTML = filtered.map(function(u) {
            var name = u.pseudonim || u.pseudonym || u.agency_name || 'Fără nume';
            var typeLabel = u.account_type === 'profesional' ? '🏢 Agenție' : '👤 Activ';
            var typeColor = u.account_type === 'profesional' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700';
            var adminBadge = u.is_super_admin ? ' <span class="text-[10px] px-1.5 py-0.5 rounded bg-red-100 text-red-700 ml-1">Admin</span>' : '';
            var date = u.created_at ? new Date(u.created_at).toLocaleDateString('ro-RO') : '-';
            
            // Status
            var isSuspended = u.suspended_until && new Date(u.suspended_until) > new Date();
            var isDeleted = u.account_status === 'deleted';
            var isPending = u.account_type === 'profesional' && u.account_status === 'pending';
            var statusBadge = '';
            if (isDeleted) {
                statusBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded bg-red-100 text-red-700 ml-1">Șters</span>';
            } else if (isSuspended) {
                var days = Math.ceil((new Date(u.suspended_until) - new Date()) / 86400000);
                statusBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded bg-yellow-100 text-yellow-700 ml-1">Suspendat ' + days + 'z</span>';
            } else if (isPending) {
                statusBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded bg-orange-100 text-orange-700 ml-1">⏳ Pending</span>';
            }
            
            // Actions
            var actions = '<a href="/profile-view-new.html?id=' + u.user_id + '" target="_blank" class="text-gray-400 hover:text-gray-700 mx-1" title="Vezi profil"><i class="fas fa-eye"></i></a>';
            if (isPending) {
                actions += '<button onclick="approveAgency(\'' + u.user_id + '\', \'' + name.replace(/'/g, "\\'") + '\')" class="text-green-600 hover:text-green-800 mx-1" title="Aprobă agenția"><i class="fas fa-check-circle"></i></button>';
            }
            if (!u.is_super_admin && !isDeleted) {
                if (isSuspended) {
                    actions += '<button onclick="unsuspendUser(\'' + u.user_id + '\')" class="text-green-500 hover:text-green-700 mx-1" title="Reactivează"><i class="fas fa-unlock"></i></button>';
                } else {
                    actions += '<button onclick="suspendUser(\'' + u.user_id + '\', \'' + name.replace(/'/g, "\\'") + '\')" class="text-yellow-500 hover:text-yellow-700 mx-1" title="Suspendă 30 zile"><i class="fas fa-ban"></i></button>';
                }
                actions += '<button onclick="deleteUser(\'' + u.user_id + '\', \'' + name.replace(/'/g, "\\'") + '\')" class="text-gray-400 hover:text-red-600 mx-1" title="Șterge cont"><i class="fas fa-trash"></i></button>';
            }
            
            return '<tr class="border-t hover:bg-gray-50' + (isDeleted ? ' opacity-50' : '') + '">' +
                '<td class="px-4 py-3"><div class="font-medium text-gray-900">' + name + adminBadge + statusBadge + '</div></td>' +
                '<td class="px-4 py-3 text-gray-500 text-xs">' + (u.email || '-') + '</td>' +
                '<td class="px-4 py-3"><span class="text-xs px-2 py-1 rounded-full ' + typeColor + '">' + typeLabel + '</span></td>' +
                '<td class="px-4 py-3 text-gray-600">' + (u.oras || '-') + '</td>' +
                '<td class="px-4 py-3 text-gray-500 text-xs">' + date + '</td>' +
                '<td class="px-4 py-3 text-right">' + actions + '</td></tr>';
        }).join('');
    }

    window.filterUsers = function(st) {
        currentFilter = st;
        document.querySelectorAll('.u-filter').forEach(function(b) {
            if (b.dataset.st === st) {
                b.className = 'u-filter active px-3 py-1.5 rounded-full text-xs font-medium border border-gray-300 bg-gray-900 text-white';
            } else {
                b.className = 'u-filter px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 bg-white text-gray-600 hover:border-gray-400';
            }
        });
        renderTable();
    };

    window.approveAgency = async function(userId, name) {
        if (!confirm('Aprobă agenția „' + name + '"? Va putea publica terenuri pe platformă.')) return;
        var { error } = await sb.from('profiles').update({
            account_status: 'active'
        }).eq('user_id', userId);
        if (error) { alert('Eroare: ' + error.message); return; }
        var u = allUsers.find(function(x) { return x.user_id === userId; });
        if (u) u.account_status = 'active';
        
        // Notify the agency that they've been approved
        try {
            // Get email from profiles table (denormalized from auth.users)
            var { data: prof, error: profErr } = await sb.from('profiles')
                .select('email')
                .eq('user_id', userId)
                .single();
            
            console.log('approveAgency: profile fetch result', { prof, profErr });
            
            // Also try to get email from current allUsers cache as fallback
            var emailToNotify = (prof && prof.email) || (u && u.email) || null;
            console.log('approveAgency: email to notify', emailToNotify);
            
            if (emailToNotify && typeof notifyAdmins === 'function') {
                console.log('approveAgency: sending notification to', emailToNotify);
                var notifyResult = await notifyAdmins('account_reactivated', {
                    user_name: name,
                    recipient_email: emailToNotify
                });
                console.log('approveAgency: notification result', notifyResult);
                alert('Agenția a fost aprobată! Email trimis la: ' + emailToNotify);
            } else {
                console.warn('approveAgency: no email found, notification not sent');
                alert('Agenția a fost aprobată, dar nu am putut trimite email (lipsește adresa).');
            }
        } catch(e) { 
            console.error('Approve notify failed:', e); 
            alert('Agenția a fost aprobată, dar a apărut o eroare la trimiterea emailului: ' + e.message);
        }
        
        renderTable();
    };

    window.suspendUser = async function(userId, name) {
        if (!confirm('Suspendă contul „' + name + '" pentru 30 de zile?')) return;
        var suspendDate = new Date();
        suspendDate.setDate(suspendDate.getDate() + 30);
        var { error } = await sb.from('profiles').update({
            suspended_until: suspendDate.toISOString(),
            account_status: 'suspended'
        }).eq('user_id', userId);
        if (error) { alert('Eroare: ' + error.message); return; }
        var u = allUsers.find(function(x) { return x.user_id === userId; });
        if (u) { u.suspended_until = suspendDate.toISOString(); u.account_status = 'suspended'; }
        
        // Notify user by email + dedicated superadmin call (account_suspended
        // is in CC_IF_NO_RECIPIENT, so we need a separate no-recipient call).
        try {
            var { data: prof } = await sb.from('profiles').select('email').eq('user_id', userId).single();
            if (typeof notifyAdmins === 'function') {
                if (prof && prof.email) {
                    notifyAdmins('account_suspended', {
                        user_name: name,
                        user_email: prof.email,
                        suspended_until: suspendDate.toLocaleDateString('ro-RO'),
                        recipient_email: prof.email
                    });
                }
                // Dedicated superadmin call — no recipient.
                notifyAdmins('account_suspended', {
                    user_name: name,
                    user_email: prof?.email,
                    suspended_until: suspendDate.toLocaleDateString('ro-RO')
                });
            }
        } catch(e) { console.warn('Suspend notify failed:', e); }
        
        renderTable();
    };

    window.unsuspendUser = async function(userId) {
        var { error } = await sb.from('profiles').update({
            suspended_until: null,
            account_status: 'active'
        }).eq('user_id', userId);
        if (error) { alert('Eroare: ' + error.message); return; }
        var u = allUsers.find(function(x) { return x.user_id === userId; });
        if (u) { u.suspended_until = null; u.account_status = 'active'; }
        
        // Notify user by email. account_reactivated is in SUPERADMIN_CC_ALWAYS,
        // so the superadmin always gets a copy — no second call needed.
        try {
            var { data: prof } = await sb.from('profiles').select('email, pseudonym').eq('user_id', userId).single();
            if (prof && prof.email && typeof notifyAdmins === 'function') {
                notifyAdmins('account_reactivated', {
                    user_name: prof.pseudonym || 'Utilizator',
                    user_email: prof.email,
                    recipient_email: prof.email
                });
            }
        } catch(e) { console.warn('Unsuspend notify failed:', e); }
        
        renderTable();
    };

    window.deleteUser = async function(userId, name) {
        if (!confirm('Sigur vrei să ștergi contul „' + name + '"? Utilizatorul nu va mai putea accesa platforma.')) return;
        
        // Get email BEFORE marking as deleted
        var userEmail = null;
        try {
            var { data: prof } = await sb.from('profiles').select('email').eq('user_id', userId).single();
            userEmail = prof?.email;
        } catch(e) {}
        
        var { error } = await sb.from('profiles').update({
            account_status: 'deleted'
        }).eq('user_id', userId);
        if (error) { alert('Eroare: ' + error.message); return; }
        var u = allUsers.find(function(x) { return x.user_id === userId; });
        if (u) u.account_status = 'deleted';
        
        // Notify user by email + dedicated superadmin call.
        // The frontend used to send `admin_email: userEmail`, which the edge
        // function interprets as "explicit recipient" and therefore SKIPS the
        // superadmin CC. We split into two calls:
        //   1. recipient_email = the deleted user (gets the notification)
        //   2. no recipient = the superadmin gets the env-fallback CC
        if (typeof notifyAdmins === 'function') {
            try {
                if (userEmail) {
                    notifyAdmins('account_deleted', {
                        user_name: name,
                        user_email: userEmail,
                        recipient_email: userEmail
                    });
                }
                // Dedicated superadmin call — no recipient set.
                notifyAdmins('account_deleted', {
                    user_name: name,
                    user_email: userEmail
                });
            } catch(e) { console.warn('Delete notify failed:', e); }
        }
        
        renderTable();
    };

    document.addEventListener('DOMContentLoaded', checkAdmin);
    </script>
</body>
</html>
