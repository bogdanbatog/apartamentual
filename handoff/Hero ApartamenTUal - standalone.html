document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   #c06a4f;\n  --slate:        #6f80a4;\n  --sage:         #84a07f;\n  --sage-2:       #93a98c;\n  --mauve:        #a96f84;\n  --ochre:        #bf9a63;\n  --cream-tile:   #ece8db;\n  --cream-tile-2: #e4dfd0;\n\n  /* status */\n  --ok:           #6f9168;\n  --pending:      #c79a4f;\n\n  /* per-variantă (suprascris pe .hero) */\n  --accent:       var(--slate);\n\n  --maxw: 1360px;\n  --pad-x: clamp(22px, 5vw, 88px);\n}\n\n*{ box-sizing:border-box; }\nhtml,body{ margin:0; }\nbody{\n  background:var(--paper);\n  color:var(--ink);\n  font-family:\"Hanken Grotesk\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  min-height:100vh;\n}\n\n/* ---------- top nav (comun) ---------- */\n.nav{\n  max-width:var(--maxw);\n  margin:0 auto;\n  padding:26px var(--pad-x) 0;\n  display:flex;\n  align-items:center;\n  gap:40px;\n}\n.brand{\n  font-size:1.28rem;\n  font-weight:700;\n  letter-spacing:-.01em;\n  white-space:nowrap;\n  color:var(--ink);\n}\n.brand b{ font-weight:800; }\n.brand .by{ color:var(--ink-faint); font-weight:500; font-size:.92rem; margin-left:.35em; }\n.nav__links{\n  display:flex;\n  gap:clamp(18px,2.4vw,40px);\n  margin:0 auto 0 28px;\n  list-style:none;\n  padding:0;\n}\n.nav__links a{\n  color:var(--ink);\n  text-decoration:none;\n  font-weight:500;\n  font-size:1.02rem;\n  white-space:nowrap;\n  transition:color .18s;\n}\n.nav__links a:hover{ color:var(--accent); }\n.nav__avatar{\n  flex:none;\n  width:46px; height:46px;\n  border-radius:50%;\n  display:grid; place-items:center;\n  background:var(--btn-dark);\n  color:#fff;\n  font-weight:700;\n  font-size:.95rem;\n  letter-spacing:.02em;\n  border:none; cursor:pointer;\n  box-shadow:0 0 0 1px rgba(0,0,0,.04);\n}\n.nav__avatar:focus-visible{ outline:3px solid color-mix(in srgb, var(--ink) 45%, transparent); outline-offset:2px; }\n\n/* ---------- hero (comun) ---------- */\n.stage{ overflow:hidden; }\n.hero{\n  position:relative;\n  max-width:var(--maxw);\n  margin:0 auto;\n  padding:clamp(40px,7vh,86px) var(--pad-x) clamp(48px,8vh,92px);\n  display:flex; flex-direction:column; align-items:flex-start;\n  justify-content:center;\n  min-height:clamp(440px, 56vh, 560px);\n}\n.hero[hidden]{ display:none; }\n.hero > *{ position:relative; z-index:1; max-width:580px; }\n\n.eyebrow{\n  display:flex; align-items:center; gap:11px;\n  white-space:nowrap;\n  font-size:.82rem; font-weight:700;\n  letter-spacing:.19em; text-transform:uppercase;\n  color:var(--ink-faint);\n  margin-bottom:26px;\n}\n.eyebrow .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; }\n\n.title{\n  font-weight:600;\n  font-size:clamp(2.5rem, 6.1vw, 5rem);\n  line-height:1.02;\n  letter-spacing:-.022em;\n  margin:0 0 .5em;\n  max-width:14ch;\n  text-wrap:balance;\n}\n.title .accent{ color:var(--accent); }\n\n.lead{\n  font-size:clamp(1.06rem, 1.55vw, 1.32rem);\n  line-height:1.5;\n  color:var(--ink-soft);\n  max-width:30ch;\n  margin:0 0 34px;\n  text-wrap:pretty;\n}\n\n/* status agenție (varianta B) */\n.status{\n  align-self:start;\n  display:flex; flex-direction:column; gap:18px;\n  margin:0 0 34px;\n  max-width:34ch;\n}\n.status__line{\n  font-size:clamp(1.06rem,1.55vw,1.28rem);\n  line-height:1.5; color:var(--ink-soft);\n  margin:0; text-wrap:pretty;\n}\n.status__chips{ display:flex; flex-wrap:wrap; gap:10px; }\n.chip{\n  display:inline-flex; align-items:center; gap:9px;\n  white-space:nowrap;\n  padding:9px 16px 9px 13px;\n  background:var(--card);\n  border:1px solid var(--line-strong);\n  border-radius:999px;\n  font-weight:600; font-size:1rem;\n  color:var(--ink);\n}\n.chip .sdot{ width:9px; height:9px; border-radius:50%; }\n.chip .sdot.ok{ background:var(--ok); }\n.chip .sdot.pending{ background:var(--pending); }\n.chip .muted{ color:var(--ink-faint); font-weight:500; }\n\n.actions{\n  display:flex; flex-wrap:wrap; gap:14px;\n  margin-bottom:18px;\n}\n.btn{\n  font-family:inherit;\n  font-weight:600; font-size:1.04rem;\n  padding:16px 26px;\n  border-radius:13px;\n  cursor:pointer;\n  text-decoration:none;\n  display:inline-flex; align-items:center; gap:.5em;\n  transition:transform .15s ease, background .18s, border-color .18s, color .18s;\n  border:1.5px solid transparent;\n  white-space:nowrap;\n}\n.btn:active{ transform:translateY(1px); }\n.btn--primary{ background:var(--btn-dark); color:#fff; }\n.btn--primary:hover{ background:#000; }\n.btn--ghost{ background:transparent; color:var(--ink); border-color:var(--line-strong); }\n.btn--ghost:hover{ border-color:var(--ink); }\n.btn:focus-visible{ outline:3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset:3px; }\n\n.micro{\n  font-size:.96rem;\n  color:var(--ink-faint);\n}\n.micro b{ color:var(--ink-soft); font-weight:600; }\n\n/* ---------- cluster plutitor (comun) ---------- */\n.cluster{\n  position:absolute; z-index:0;\n  top:0; right:var(--pad-x); bottom:0;\n  width:clamp(360px, 44%, 600px);\n  max-width:none;\n}\n\n/* float subtil — intensitate 2 (calm, NU bouncy). Folosim proprietatea `translate`\n   ca să putem păstra `rotate` (înclinarea) independent, inclusiv la reduced-motion. */\n@keyframes floaty{\n  0%,100%{ translate:0 0; }\n  50%    { translate:0 var(--amp,-9px); }\n}\n.floater{\n  position:absolute;\n  animation:floaty var(--dur,8s) ease-in-out var(--delay,0s) infinite;\n  will-change:translate;\n}\n\n/* \"tile-avatar\" vecini (A) — pătrate desprinse din bara de jos,\n   dimensionate după compatibilitate (nr. interese comune) */\n.neighbor{\n  width:calc(var(--size,96px) * var(--k,1));\n  height:calc(var(--size,96px) * var(--k,1));\n  border-radius:5px;\n  rotate:var(--rot,0deg);\n  display:grid; place-items:center;\n  background:var(--bg,var(--slate));\n  color:#fff;\n  text-decoration:none;\n  box-shadow:0 18px 40px -16px rgba(28,27,24,.5);\n  cursor:pointer;\n  transition:box-shadow .2s, filter .2s;\n}\n.neighbor .ini{ font-weight:700; font-size:calc(var(--size,96px) * var(--k,1) * .3); letter-spacing:.02em; }\n.neighbor:hover{ filter:brightness(1.05); box-shadow:0 26px 50px -16px rgba(28,27,24,.62); }\n.neighbor:focus-visible{ outline:3px solid var(--ink); outline-offset:4px; }\n\n/* badge procent */\n.neighbor .pct{\n  position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);\n  background:var(--card); color:var(--ink);\n  font-weight:700; font-size:.78rem;\n  padding:4px 9px; border-radius:999px;\n  box-shadow:0 4px 12px -4px rgba(28,27,24,.35);\n  border:1px solid var(--line);\n  white-space:nowrap;\n}\n\n/* tooltip nume */\n.neighbor .tip,\n.landpin .tip{\n  position:absolute; bottom:calc(100% + 12px); left:50%;\n  transform:translate(-50%,6px);\n  background:var(--ink); color:#fff;\n  padding:9px 13px; border-radius:10px;\n  font-size:.86rem; font-weight:500; line-height:1.3;\n  white-space:nowrap;\n  opacity:0; pointer-events:none;\n  transition:opacity .18s, transform .18s;\n  box-shadow:0 12px 28px -10px rgba(0,0,0,.5);\n  z-index:5;\n}\n.neighbor .tip b,\n.landpin .tip b{ font-weight:700; }\n.neighbor .tip::after,\n.landpin .tip::after{\n  content:\"\"; position:absolute; top:100%; left:50%; transform:translateX(-50%);\n  border:6px solid transparent; border-top-color:var(--ink);\n}\n.neighbor:hover .tip, .neighbor:focus-visible .tip,\n.landpin:hover .tip, .landpin:focus-visible .tip{\n  opacity:1; transform:translate(-50%,0);\n}\n/* pentru pătratele de sus: tooltip-ul apare DEDESUBT, ca să nu intre peste header */\n.neighbor .tip--down{\n  bottom:auto; top:calc(100% + 22px);\n  transform:translate(-50%,-6px);\n}\n.neighbor .tip--down::after{\n  top:auto; bottom:100%;\n  border-top-color:transparent;\n  border-bottom-color:var(--ink);\n}\n\n/* pini teren (B) */\n.landpin{\n  display:flex; align-items:center; gap:12px;\n  width:232px;\n  padding:12px;\n  background:var(--card);\n  border:1px solid var(--line);\n  border-radius:16px;\n  text-decoration:none; color:var(--ink);\n  box-shadow:0 16px 36px -20px rgba(28,27,24,.5);\n  cursor:pointer;\n  transition:box-shadow .2s, transform .15s;\n}\n.landpin:hover{ box-shadow:0 22px 46px -20px rgba(28,27,24,.6); }\n.landpin:focus-visible{ outline:3px solid var(--ink); outline-offset:4px; }\n.landpin__thumb{\n  flex:none; width:46px; height:46px; border-radius:10px;\n  background:var(--bg,var(--sage));\n}\n.landpin__body{ display:flex; flex-direction:column; gap:5px; min-width:0; }\n.landpin__loc{ font-weight:700; font-size:1rem; line-height:1.1; white-space:nowrap; }\n.landpin__status{ display:flex; align-items:center; gap:7px; font-size:.84rem; color:var(--ink-soft); font-weight:500; white-space:nowrap; }\n.landpin__status .sdot{ width:8px; height:8px; border-radius:50%; }\n.landpin__status .sdot.ok{ background:var(--ok); }\n.landpin__status .sdot.pending{ background:var(--pending); }\n\n/* ---------- bara de apartamente (NESCHIMBATĂ) ---------- */\n.aptbar{\n  display:flex; gap:5px;\n  height:clamp(190px, 24vh, 280px);\n  background:var(--paper);\n  padding:0 0 0;\n}\n.aptbar__cols{ flex:1 1 auto; display:flex; flex-direction:column; gap:5px; min-width:0; }\n.aptbar__row{ flex:1; display:flex; gap:5px; }\n.aptbar__row > span{ flex:var(--w,1); border-radius:2px; }\n.aptbar__big{ flex:none; width:11.5%; border-radius:2px; background:var(--ochre); }\n\n/* ---------- comutator A/B (doar pentru review) ---------- */\n.switcher{\n  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);\n  z-index:50;\n  display:flex; gap:5px; padding:5px;\n  background:rgba(28,27,24,.92);\n  backdrop-filter:blur(8px);\n  border-radius:999px;\n  box-shadow:0 16px 40px -14px rgba(0,0,0,.5);\n}\n.switcher button{\n  font-family:inherit; font-weight:600; font-size:.92rem;\n  color:#cfccc4; background:transparent;\n  border:none; cursor:pointer;\n  padding:11px 20px; border-radius:999px;\n  transition:background .18s, color .18s;\n  white-space:nowrap;\n}\n.switcher button[aria-selected=\"true\"]{ background:#fff; color:var(--ink); }\n.switcher button:focus-visible{ outline:3px solid #fff; outline-offset:2px; }\n\n/* ---------- responsive ---------- */\n@media (max-width:980px){\n  .hero{ min-height:0; padding-top:clamp(28px,5vh,52px); }\n  .hero > *{ max-width:100%; }\n  .title{ max-width:18ch; }\n  /* ordine pe mobil: eyebrow, titlu, CLUSTER (sub titlu), lead/status, CTA, micro */\n  .eyebrow{ order:1; }\n  .title{ order:2; }\n  .cluster{ order:3; }\n  .lead{ order:4; }\n  .status{ order:4; }\n  .actions{ order:5; }\n  .micro{ order:6; }\n  /* cluster devine rând orizontal static */\n  .cluster{\n    position:static; width:100%; max-width:100%;\n    display:flex; flex-wrap:wrap; gap:30px 26px;\n    align-items:center; justify-content:flex-start;\n    margin:8px 0 32px;\n  }\n  .floater{ position:static !important; }\n  .neighbor{ --k:.6 !important; }\n  /* pe mobil: maxim 3 cerculețe / 3 pini */\n  .cluster .floater:nth-child(n+4){ display:none; }\n  .neighbor .pct{ bottom:-6px; }\n  .landpin{ width:auto; min-width:190px; }\n}\n@media (max-width:560px){\n  .nav__links{ display:none; }\n  .nav{ justify-content:space-between; }\n  .cluster .floater:nth-child(n+3){ display:none; } /* 2 pe ecrane mici */\n  .switcher button{ padding:10px 14px; font-size:.84rem; }\n}\n\n@media (prefers-reduced-motion:reduce){\n  .floater{ animation:none !important; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body data-variant=\"a\">\n\n  <!-- splash / no-JS fallback pentru fișierul standalone -->\n  \n\n\n  <!-- ============ NAV (comun) ============ -->\n  <header class=\"nav\">\n    <div class=\"brand\">apartamen<b>TU<\u002Fb>al<span class=\"by\">by LTFB Studio<\u002Fspan><\u002Fdiv>\n    <ul class=\"nav__links\">\n      <li><a href=\"#\">Ce este<\u002Fa><\u002Fli>\n      <li><a href=\"#\">Terenuri<\u002Fa><\u002Fli>\n      <li><a href=\"#\">Utilizatori<\u002Fa><\u002Fli>\n      <li><a href=\"#\">Grupuri<\u002Fa><\u002Fli>\n      <li><a href=\"#\">Parteneri<\u002Fa><\u002Fli>\n      <li><a href=\"#\">Povestea noastră<\u002Fa><\u002Fli>\n    <\u002Ful>\n    <button class=\"nav__avatar js-navavatar\" aria-label=\"Contul meu\">A<\u002Fbutton>\n  <\u002Fheader>\n\n  <main class=\"stage\">\n\n    <!-- ============ VARIANTA A — logat, fără grup ============ -->\n    <section class=\"hero\" data-variant=\"a\" style=\"--accent:var(--terracotta);\" aria-label=\"Hero — utilizator logat fără grup\">\n      <p class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>Bun venit înapoi<\u002Fp>\n      <h1 class=\"title\">Hai să-ți găsești <span class=\"accent\">grupul<\u002Fspan>, <span class=\"js-name\">Andrei<\u002Fspan>.<\u002Fh1>\n      <p class=\"lead\">Terenuri filtrate de arhitecți și grupuri care se formează chiar acum, în zonele care te interesează.<\u002Fp>\n      <div class=\"actions\">\n        <a class=\"btn btn--primary\" href=\"#\">Vezi terenuri <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n        <a class=\"btn btn--ghost\" href=\"#\">Grupuri în formare<\u002Fa>\n      <\u002Fdiv>\n      <p class=\"micro\"><b>4 vecini<\u002Fb> cu cele mai multe interese comune cu tine.<\u002Fp>\n      <div class=\"cluster js-cluster-a\" role=\"list\" aria-label=\"Vecini compatibili\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ VARIANTA B — cont agenție ============ -->\n    <section class=\"hero\" data-variant=\"b\" hidden=\"\" style=\"--accent:var(--slate);\" aria-label=\"Hero — cont agenție imobiliară\">\n      <p class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>Cont agenție<\u002Fp>\n      <h1 class=\"title\">Terenurile tale, <span class=\"accent js-agency\">Imobiliare Nord<\u002Fspan>.<\u002Fh1>\n      <div class=\"status\">\n        <p class=\"status__line\">Propunerile tale de teren, într-un singur loc. Urmărești statusul fiecăreia și adaugi unele noi.<\u002Fp>\n        <div class=\"status__chips\">\n          <span class=\"chip\"><span class=\"sdot ok\"><\u002Fspan>12 aprobate<\u002Fspan>\n          <span class=\"chip\"><span class=\"sdot pending\"><\u002Fspan>3 în așteptare<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"actions\">\n        <a class=\"btn btn--primary\" href=\"#\">Propune un teren nou <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n        <a class=\"btn btn--ghost\" href=\"#\">Vezi propunerile mele<\u002Fa>\n      <\u002Fdiv>\n      <p class=\"micro\">Ultima propunere: <b>acum 2 zile<\u002Fb> · Pipera, IF.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- ============ BARA DE APARTAMENTE (NESCHIMBATĂ) ============ -->\n    <div class=\"aptbar\" aria-hidden=\"true\">\n      <div class=\"aptbar__cols js-aptbar\"><\u002Fdiv>\n      <div class=\"aptbar__big\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <!-- ============ comutator A/B (review) ============ -->\n  <div class=\"switcher\" role=\"tablist\" aria-label=\"Comută varianta de hero\">\n    <button role=\"tab\" aria-selected=\"true\" data-go=\"a\">A · Logat, fără grup<\u002Fbutton>\n    <button role=\"tab\" aria-selected=\"false\" data-go=\"b\">B · Cont agenție<\u002Fbutton>\n  <\u002Fdiv>\n\n<script>\n(function(){\n  /* ---------- date mock: vecini (A) ---------- */\n  var NEIGHBORS = [\n    { name:\"Andreea M.\",   ini:\"AM\", interests:6, bg:\"var(--sage)\",      size:138, rot:\"-4deg\",   tipDown:true, top:\"3%\",  left:\"30%\", amp:\"-11px\", dur:\"8.2s\", delay:\"0s\"   },\n    { name:\"Vlad P.\",      ini:\"VP\", interests:5, bg:\"var(--terracotta)\",size:124, rot:\"3deg\",    tipDown:true, top:\"34%\", left:\"64%\", amp:\"-9px\",  dur:\"9.4s\", delay:\"-2.4s\"},\n    { name:\"Ioana & Radu\", ini:\"IR\", interests:4, bg:\"var(--slate)\",     size:110, rot:\"-2.5deg\", top:\"55%\", left:\"16%\", amp:\"-10px\", dur:\"7.6s\", delay:\"-1.2s\"},\n    { name:\"Mihai T.\",     ini:\"MT\", interests:3, bg:\"var(--mauve)\",     size:96,  rot:\"4deg\",    top:\"72%\", left:\"57%\", amp:\"-8px\",  dur:\"8.8s\", delay:\"-3.2s\"}\n  ];\n\n  function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }\n\n  /* construiește avatarurile vecinilor */\n  var ca = document.querySelector(\".js-cluster-a\");\n  NEIGHBORS.forEach(function(n){\n    var a = el(\"a\",\"floater neighbor\");\n    a.href = \"#profil-\" + n.ini.toLowerCase();\n    a.setAttribute(\"role\",\"listitem\");\n    a.setAttribute(\"aria-label\", \"Profil \" + n.name + \", \" + n.interests + \" interese comune\");\n    a.style.cssText = \"--bg:\"+n.bg+\";--size:\"+n.size+\"px;--rot:\"+n.rot+\";top:\"+n.top+\";left:\"+n.left+\";--amp:\"+n.amp+\";--dur:\"+n.dur+\";--delay:\"+n.delay+\";\";\n    a.innerHTML =\n      '<span class=\"ini\" aria-hidden=\"true\">'+n.ini+'<\u002Fspan>'+\n      '<span class=\"pct\" aria-hidden=\"true\">'+n.interests+' interese<\u002Fspan>'+\n      '<span class=\"tip'+(n.tipDown?' tip--down':'')+'\" aria-hidden=\"true\"><b>'+n.name+'<\u002Fb> · '+n.interests+' interese comune<\u002Fspan>';\n    a.addEventListener(\"click\", function(e){ e.preventDefault(); });\n    ca.appendChild(a);\n  });\n\n  /* ---------- bara de apartamente: recreare fidelă ---------- */\n  var T = {\n    cr:\"var(--cream-tile)\", cr2:\"var(--cream-tile-2)\",\n    sg:\"var(--sage)\", sg2:\"var(--sage-2)\", sl:\"var(--slate)\",\n    tc:\"var(--terracotta)\", mv:\"var(--mauve)\"\n  };\n  // [culoare, pondere-lățime]\n  var ROWS = [\n    [[\"cr\",1],[\"mv\",.7],[\"sg\",1.4],[\"cr2\",.8],[\"sg2\",1.2],[\"cr\",.7],[\"sg\",1.7],[\"sl\",.8],[\"tc\",.8],[\"cr2\",.7],[\"sg\",1.8],[\"cr\",1.5],[\"sl\",.7],[\"sl\",.7]],\n    [[\"mv\",.7],[\"sg\",1.8],[\"cr\",1.5],[\"sl\",1.9],[\"sg2\",2.2],[\"cr2\",.9],[\"sg\",.9],[\"tc\",.9],[\"cr\",1.4],[\"sg\",.9],[\"cr2\",1.1],[\"cr\",.9]],\n    [[\"mv\",.7],[\"mv\",.7],[\"sg\",1.4],[\"cr\",.8],[\"sl\",1.7],[\"cr2\",.7],[\"cr\",.7],[\"sg2\",.7],[\"cr\",.7],[\"tc\",.7],[\"sg\",.7],[\"sl\",.9],[\"cr2\",.7],[\"tc\",.7],[\"sl\",.7]]\n  ];\n  var bar = document.querySelector(\".js-aptbar\");\n  ROWS.forEach(function(row){\n    var r = el(\"div\",\"aptbar__row\");\n    row.forEach(function(t){\n      var s = el(\"span\");\n      s.style.background = T[t[0]];\n      s.style.setProperty(\"--w\", t[1]);\n      r.appendChild(s);\n    });\n    bar.appendChild(r);\n  });\n\n  /* ---------- comutator A/B ---------- */\n  var heroes = document.querySelectorAll(\".hero[data-variant]\");\n  var navAvatar = document.querySelector(\".js-navavatar\");\n  var tabs = document.querySelectorAll(\".switcher button\");\n  function go(v){\n    document.body.setAttribute(\"data-variant\", v);\n    heroes.forEach(function(h){ h.hidden = (h.getAttribute(\"data-variant\") !== v); });\n    tabs.forEach(function(b){ b.setAttribute(\"aria-selected\", String(b.getAttribute(\"data-go\")===v)); });\n    // avatar nav reflectă contul curent\n    navAvatar.textContent = (v===\"a\") ? \"A\" : \"IN\";\n    navAvatar.setAttribute(\"aria-label\", v===\"a\" ? \"Contul meu\" : \"Cont agenție\");\n  }\n  tabs.forEach(function(b){ b.addEventListener(\"click\", function(){ go(b.getAttribute(\"data-go\")); }); });\n  go(\"a\");\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
